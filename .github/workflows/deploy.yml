# Post-merge validation for `main`.
#
# This workflow does NOT deploy. Deployment is handled solely by the Vercel Git
# integration. It previously carried `Deploy to production`, `Run database migrations`,
# `Post-deploy health check`, and `Notify deployment status` jobs, none of which ever
# succeeded: the repository has no secrets configured, so the Vercel action received an
# empty token and Prisma received an empty DATABASE_URL. They were removed in issue #28.
# A workflow named `Deploy` that only runs tests is worse than none -- it reads as
# evidence that a merge shipped.
#
# This is the only workflow that runs on a push to `main` (test.yml used to run the same
# gates a second time). Status records under docs/ are committed straight to `main` after
# every unit of work; they change no code, so they run nothing (D-087).
name: Post-merge checks

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/clairkeys_test
  NEXTAUTH_SECRET: test-secret
  NEXTAUTH_URL: http://localhost:3000

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clairkeys_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push

      - name: Setup Python for OMR image regressions
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OMR regression dependencies
        run: python -m pip install -r omr-service/requirements-ci.txt

      - name: Run tests
        run: npm test

  # Branch protection is not strict, so a PR can merge on checks run against an older
  # main. This run is the only E2E evidence for the tree that was actually merged.
  # Playwright's webServer runs `npm run build && npm start` on CI, so this job also
  # builds the merge commit; there is no separate build job or build step.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Normal runs take 16-19 minutes; a hang would otherwise hold the runner for 360.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clairkeys_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high
