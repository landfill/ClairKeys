name: Issue 253 fixed-head repetition
on:
  push:
    branches: [codex/e2e-254-sample-wait]
    paths: [.github/workflows/e2e-253-verify.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    env:
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000
      PLAYWRIGHT_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d112f01910cc47070614a669391f521dc136294e
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/learn-lesson-layout.spec.ts --project=chromium --project='Mobile Chrome' --grep '목차 항목으로 다른 섹션에 도달.*1280x800' --repeat-each=10 --retries=0 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: toc-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-253-trial-${{ matrix.trial }}
          path: toc-results.json
          retention-days: 7
