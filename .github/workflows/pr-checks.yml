name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

# A new push to the same PR supersedes the previous head; finishing the old
# head's 16-minute E2E run proves nothing about what will be merged.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One filter: any file that is not documentation. The previous per-area
      # filters had to name every directory a job depends on and silently missed
      # some (next.config.mjs, src/repositories, scripts/, fixtures/). This
      # workflow is now the only PR gate, so a miss would skip every test.
      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  lint-and-type-check:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @prisma/client's postinstall generation depends on install order and can
      # silently leave the ungenerated stub, which fails the type check on every
      # Prisma type. Every other job generates explicitly; so does this one.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  test-unit:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clairkeys_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/clairkeys_test
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push

      - name: Setup Python for OMR image regressions
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OMR regression dependencies
        run: python -m pip install -r omr-service/requirements-ci.txt

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unittests
          name: codecov-pr-${{ github.event.number }}

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clairkeys_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/clairkeys_test
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-pr-${{ github.event.number }}
          path: playwright-report/
          retention-days: 7

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high

      - name: Run CodeQL analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key

      - name: Check bundle size
        run: |
          # Check if bundle size is reasonable
          if [ -d ".next" ]; then
            size=$(du -sh .next | cut -f1)
            echo "Bundle size: $size"
            # Add bundle size analysis here if needed
          fi

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test-unit, test-e2e, security-scan, build-check]
    if: always()

    steps:
      - name: Create PR check summary
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              lint: '${{ needs.lint-and-type-check.result }}',
              unit: '${{ needs.test-unit.result }}',
              e2e: '${{ needs.test-e2e.result }}',
              security: '${{ needs.security-scan.result }}',
              build: '${{ needs.build-check.result }}'
            };
            
            const getEmoji = (result) => {
              if (result === 'success') return '✅';
              if (result === 'failure') return '❌';
              if (result === 'skipped') return '⏭️';
              return '⏳';
            };
            
            const allPassed = Object.values(results).every(
              result => result === 'success' || result === 'skipped'
            );

            await core.summary
              .addHeading('🔍 PR Check Results', 2)
              .addTable([
                [
                  { data: 'Check', header: true },
                  { data: 'Status', header: true },
                  { data: 'Result', header: true }
                ],
                ['Lint (ESLint + tsc)', getEmoji(results.lint), results.lint],
                ['Unit Tests', getEmoji(results.unit), results.unit],
                ['E2E Tests', getEmoji(results.e2e), results.e2e],
                ['Security Scan', getEmoji(results.security), results.security],
                ['Build Check', getEmoji(results.build), results.build]
              ])
              .addRaw(
                allPassed
                  ? '🎉 All checks passed! This PR is ready for review.'
                  : '⚠️ Some checks failed. Please review and fix the issues.'
              )
              .write();

  # Require all checks to pass for PR to be mergeable
  all-checks:
    name: All Checks Complete
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test-unit, test-e2e, security-scan, build-check]
    if: always()

    steps:
      - name: Check all results
        run: |
          # Only success or skipped (no code changed) counts. A cancelled or
          # timed-out job used to pass this gate because only "failure" was checked.
          failed=0
          for r in "lint=${{ needs.lint-and-type-check.result }}" \
                   "unit=${{ needs.test-unit.result }}" \
                   "e2e=${{ needs.test-e2e.result }}" \
                   "security=${{ needs.security-scan.result }}" \
                   "build=${{ needs.build-check.result }}"; do
            case "${r#*=}" in
              success|skipped) echo "✅ $r" ;;
              *) echo "❌ $r"; failed=1 ;;
            esac
          done
          exit $failed
