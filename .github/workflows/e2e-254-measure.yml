name: Issue 254 sample wait diagnosis

on:
  push:
    branches: [codex/e2e-254-sample-wait]

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clairkeys_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/clairkeys_test
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000
      PLAYWRIGHT_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npx playwright install --with-deps webkit
      - name: Repeat original test and collect geometry without retries
        run: npx playwright test e2e/first-play-sample-loading.spec.ts e2e/sample-wait-diagnostic.spec.ts --project=webkit --project='Mobile Safari' --repeat-each=10 --retries=0 --trace=on --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-254-trial-${{ matrix.trial }}
          path: |
            e2e-results.json
            test-results/
          retention-days: 7
