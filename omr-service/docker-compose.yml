version: '3.8'

services:
  clairkeys-omr:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Allow access to Docker daemon
      - ./temp:/tmp/processing  # Mount temporary processing directory
    environment:
      # D-011: no storage credentials. The service returns the animation JSON
      # through GET /result/{job_id} and the Next.js side stores it.
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      # ENVIRONMENT=development is the only mode that runs without a secret.
      # Any other value refuses every request until OMR_SHARED_SECRET is set.
      - OMR_SHARED_SECRET=${OMR_SHARED_SECRET:-}
    networks:
      - omr-network
    depends_on:
      - audiveris
    restart: unless-stopped

  # Pre-pulled Audiveris service for faster processing
  audiveris:
    image: toprock/audiveris
    command: ["sleep", "infinity"]  # Keep container alive
    volumes:
      - audiveris-cache:/cache
    networks:
      - omr-network

networks:
  omr-network:
    driver: bridge

volumes:
  audiveris-cache: