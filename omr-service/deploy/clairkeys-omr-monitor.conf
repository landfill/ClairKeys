# Optional drop-in: install only after the host snapshot directory exists.
# Keep this command aligned with clairkeys-omr.service when changing deployment.
[Service]
ExecStart=
ExecStart=/usr/bin/podman run \
    --cidfile=%t/%n.ctr-id \
    --cgroups=no-conmon \
    --sdnotify=conmon \
    --replace \
    -d \
    --name clairkeys-omr-prod \
    -p 0.0.0.0:3000:8000 \
    --env-file /etc/clairkeys-omr.env \
    -v /var/lib/clairkeys-omr-monitor:/run/clairkeys-monitor:ro \
    -v /data:/data clairkeys-omr:current
